name: Build and verify
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./mvnw -B clean verify
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
      - run: npm run test:e2e:lifecycle
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/target/surefire-reports
            backend/target/surefire-reports
            frontend/playwright-report

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Build and start backend with application defaults
        run: docker compose up --build -d
      - name: Check backend health and exact snapshot version
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 5 \
            http://127.0.0.1:8080/api/v1/health -o /tmp/health.json
          python3 - <<'PYHEALTH'
          import json, os
          with open('/tmp/health.json') as response:
              health = json.load(response)
          assert health == {
              'status': 'UP', 'java': '21', 'hashMapSnapshotVersion': '2',
              'version': '0.0.0-' + os.environ['GITHUB_SHA'] + '-SNAPSHOT',
          }, health
          PYHEALTH
      - name: Show container logs and stop backend
        if: always()
        run: |
          docker compose logs
          docker compose down
