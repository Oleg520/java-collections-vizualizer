name: Build and verify
on: pull_request
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Read IntelliJ formatter version
        id: formatter
        run: |
          python3 - <<'PY'
          import os, runpy
          formatter = runpy.run_path('scripts/java-format.py')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={formatter['VERSION']}-{formatter['BUILD']}\n")
          PY
      - name: Cache IntelliJ Java formatter
        uses: actions/cache@v4
        with:
          path: ~/.cache/jcv-java-formatter
          # Script-only edits must not invalidate the ~1.6 GB IDE installation.
          key: java-formatter-${{ runner.os }}-${{ runner.arch }}-${{ steps.formatter.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check version, formatter tooling and release contracts
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify Java formatting, algorithms, API and backend JAR
        timeout-minutes: 15
        run: ./mvnw -B -Djava.format=check verify
      - name: Build, typecheck and test frontend
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund && npm run build && npm test
        working-directory: frontend
      # Ubuntu 24.04 runners already have Chromium libraries. Avoid apt mirrors
      # and download only the headless browser used by both Playwright projects.
      - name: Install Chromium headless shell
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '15000'
      - name: Verify local split demos in the standard development UI
        timeout-minutes: 3
        run: npm run test:e2e -- --output test-results/development --grep 'local splits use|local preparation|resize focus explains'
        working-directory: frontend
        env:
          E2E_PREVIEW: '0'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/development
      - name: Verify both collections in production UI (desktop and mobile)
        timeout-minutes: 6
        run: npm run test:e2e -- --output test-results/production
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/production
      - name: Verify session lifecycle under strict quotas
        timeout-minutes: 3
        run: npm run test:e2e:lifecycle -- --output test-results/lifecycle
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/lifecycle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          retention-days: 7
          path: |
            core/target/surefire-reports
            backend/target/surefire-reports
            frontend/playwright-report
            frontend/test-results
