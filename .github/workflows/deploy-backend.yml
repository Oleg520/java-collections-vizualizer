name: Deploy backend manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-collections-visualizer-backend-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Require main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and deployment fixtures
        run: |
          timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          ./mvnw -B -Dproject.build.outputTimestamp="$timestamp" verify
          python3 -m unittest discover -s deploy/tests -v
          bash -n deploy/upload_backend.sh
      - name: Identify exact artifact
        id: artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sha256=$(sha256sum backend/target/backend-0.1.0.jar)
          sha256=${sha256%% *}
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'Commit: `%s`\n\nJAR SHA-256: `%s`\n' "$COMMIT_SHA" "$sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          path: backend/target/backend-0.1.0.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Owner must configure this environment to allow the main branch only.
    environment: backend-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ github.sha }}
          path: artifact
      - name: Deliver verified JAR and check health with automatic rollback
        env:
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_SHA256: ${{ needs.verify.outputs.sha256 }}
          JCV_DEPLOY_SSH_KEY: ${{ secrets.JCV_DEPLOY_SSH_KEY }}
          JCV_DEPLOY_KNOWN_HOSTS: ${{ secrets.JCV_DEPLOY_KNOWN_HOSTS }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          bash deploy/upload_backend.sh "$COMMIT_SHA" "$ARTIFACT_SHA256" artifact/backend-0.1.0.jar
          printf 'Local and public HTTPS health checks passed for `%s`.\n' "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
