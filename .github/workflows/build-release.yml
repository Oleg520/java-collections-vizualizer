name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Public HTTPS origin compiled into this release (same as the site for /api; no trailing slash)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate generic build input
        env:
          VITE_API_URL: ${{ inputs.api_origin }}
        run: |
          python3 - <<'PYORIGIN'
          import os, runpy
          runpy.run_path('scripts/package-release.py')['origin'](os.environ['VITE_API_URL'])
          PYORIGIN
      - name: Require unique release tag at dispatch SHA
        id: release
        run: |
          version=$(sh scripts/require-frontend-release.sh)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Frontend commit: `%s`\n\nVersion: `%s`\n' "$GITHUB_SHA" "$version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify version fixtures and build local test backend
        run: |
          python3 -m unittest discover -s scripts/tests -v
          timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          ./mvnw -B -Dproject.build.outputTimestamp="$timestamp" clean verify
      - name: Build and test frontend against local backend
        working-directory: frontend
        env:
          VITE_API_URL: ''
          E2E_PREVIEW: '1'
        run: |
          npm ci
          npm run build
          npm test
      # GitHub's ubuntu-24.04 runner already provides the Chromium libraries.
      # Do not install system packages through apt for every release build.
      - name: Install Chromium headless shell
        timeout-minutes: 3
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '15000'
        run: npx playwright install --only-shell chromium
      - name: Verify frontend against local backend (desktop/mobile and lifecycle)
        working-directory: frontend
        env:
          VITE_API_URL: ''
          E2E_PREVIEW: '1'
        run: |
          npm run test:e2e
          npm run test:e2e:lifecycle
      - name: Build release assets
        env:
          VITE_API_URL: ${{ inputs.api_origin }}
        run: |
          npm --prefix frontend run build
          test -f frontend/dist/index.html
          test ! -e frontend/dist/404.html
          test ! -e frontend/dist/_redirects
      - name: Package verified release
        env:
          VITE_API_URL: ${{ inputs.api_origin }}
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
