server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_THREADS:8}
      min-spare: 2
    max-connections: 64
    accept-count: 32
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
spring:
  application:
    name: java-collections-visualizer
  jackson:
    deserialization:
      fail-on-unknown-properties: true
visualizer:
  allow-full-trace: ${ALLOW_FULL_TRACE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  session-ttl-seconds: ${SESSION_TTL_SECONDS:1800}
  max-sessions: ${MAX_SESSIONS:128}
