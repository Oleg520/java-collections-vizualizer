server:
  forward-headers-strategy: none
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_THREADS:8}
      min-spare: 2
    max-connections: 64
    accept-count: 32
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
spring:
  application:
    name: java-collections-visualizer
  jackson:
    deserialization:
      fail-on-unknown-properties: true
visualizer:
  allow-full-trace: ${ALLOW_FULL_TRACE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  session-ttl-seconds: ${SESSION_TTL_SECONDS:1800}
  max-sessions: ${MAX_SESSIONS:128}
  max-sessions-per-client: ${MAX_SESSIONS_PER_CLIENT:0}
  trusted-proxies: ${TRUSTED_PROXIES:}
  limits:
    window-seconds: ${RATE_WINDOW_SECONDS:60}
    session-creations: ${SESSION_CREATE_RATE_LIMIT:30}
    work-requests: ${WORK_RATE_LIMIT:600}
    tracked-clients: ${MAX_TRACKED_CLIENTS:4096}
    concurrent-work: ${MAX_CONCURRENT_WORK:2}
    concurrent-work-per-client: ${MAX_CONCURRENT_WORK_PER_CLIENT:1}

# Separate listener: never forward this port through the public proxy.
management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:18083}
  endpoints:
    web:
      exposure:
        include: health,metrics
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95
